<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — DEAD OR ALIVE</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="desk admin">
      <a class="logo" href="/" aria-label="DEAD OR ALIVE home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a7dff" /><stop offset="1" stop-color="#4b2ee0" /></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#logo-g)" /><path d="M9 21v-9l4 3.2a8.6 8.6 0 0 1 6 0l4-3.2v9a7 7 0 0 1-14 0z" fill="#fff" /><circle cx="13.3" cy="20" r="1.3" fill="#3b2bc2" /><circle cx="18.7" cy="20" r="1.3" fill="#3b2bc2" /><rect x="6" y="22.5" width="20" height="5" rx="1.5" fill="#e4c69c" stroke="#12132a" stroke-width="1.2" /></svg>
        <span>Dead or Alive</span>
      </a>
      <p class="kicker brand" style="margin-top: 2rem">Back room</p>
      <h1 class="name">The desk</h1>
      <p class="usp" id="queue"></p>

      <form id="unlock" class="unlock">
        <label class="label">Admin key
          <input name="key" type="password" autocomplete="current-password" required />
        </label>
        <button class="submit" type="submit">Open the desk</button>
        <p class="alert" role="alert" hidden></p>
      </form>

      <section id="board" class="section" hidden>
        <div class="bar">
          <h2 class="kicker">Orders</h2>
          <div class="tabs" role="tablist">
            <button type="button" data-view="open" aria-pressed="true">Open</button>
            <button type="button" data-view="done" aria-pressed="false">Done</button>
            <button type="button" data-view="all" aria-pressed="false">All</button>
          </div>
          <button type="button" class="link" id="refresh">Refresh</button>
          <button type="button" class="link" id="lock">Lock</button>
        </div>
        <p class="alert" id="board-alert" role="alert" hidden></p>
        <ul class="orders" id="orders"></ul>
      </section>

      <section id="composer" class="section" hidden>
        <h2 class="kicker">Stamp <span id="c-target"></span></h2>
        <p class="usp">Paste, drop, or pick a first-screen screenshot. Then circle what a stranger misses.</p>
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/*" hidden />
          <span>Drop screenshot here, paste it, or click to pick one.</span>
        </label>
        <div class="tools" id="tools" role="toolbar" aria-label="Marker tools" hidden>
          <div class="seg">
            <button type="button" data-tool="circle" aria-pressed="true" title="Drag to draw a circle">Circle</button>
            <button type="button" data-tool="pen" aria-pressed="false" title="Draw freehand">Pen</button>
          </div>
          <div class="seg" aria-label="Marker size">
            <button type="button" data-size="4" aria-pressed="false" title="Thin">S</button>
            <button type="button" data-size="6" aria-pressed="true" title="Medium">M</button>
            <button type="button" data-size="10" aria-pressed="false" title="Thick">L</button>
          </div>
          <div class="seg">
            <button type="button" id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
            <button type="button" id="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
            <button type="button" id="remove" title="Delete selected (Delete)" disabled>Delete</button>
          </div>
          <button type="button" class="link" id="clear-ring">Clear marks</button>
          <button type="button" class="link" id="replace">Replace screenshot</button>
        </div>
        <canvas id="canvas" hidden></canvas>
        <p class="hint" id="hint">Drag to draw. Click a mark to select it, drag to move, pull a corner to resize. Drag the stamp to move it.</p>

        <fieldset class="verdicts">
          <legend class="label">Stamp</legend>
          <label><input type="radio" name="verdict" value="DEAD" checked /><span class="word dead">DEAD</span></label>
          <label><input type="radio" name="verdict" value="COPE" /><span class="word cope">COPE</span></label>
          <label><input type="radio" name="verdict" value="ALIVE" /><span class="word alive">ALIVE</span></label>
        </fieldset>
        <label class="label">One sentence
          <input id="sentence" type="text" />
        </label>

        <label class="check"><input id="send-email" type="checkbox" checked /> Email the customer their link</label>

        <div class="actions">
          <button type="button" class="submit" id="publish">Publish verdict</button>
          <button type="button" class="submit ghost" id="download">Download PNG</button>
          <button type="button" class="submit ghost" id="email">Draft email</button>
        </div>
        <p class="published" id="published" aria-live="polite" hidden></p>
      </section>
    </main>
    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
